name: optistash
services:
  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_DB: optistash
      POSTGRES_USER: optistash
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in environment settings or a local env file}
    ports: ["127.0.0.1:${DB_PORT:-5545}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U optistash -d optistash"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: optistash-dev-php
    build:
      context: docker
      dockerfile: php.Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/backend
    volumes: [".:/app"]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY using php artisan key:generate}
      APP_URL: http://localhost:5185
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: optistash
      DB_USERNAME: optistash
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      OPTISTASH_DEPLOYMENT_MODE: ${OPTISTASH_DEPLOYMENT_MODE:-standalone}
      OPTISTASH_STANDALONE_TENANT: ${OPTISTASH_STANDALONE_TENANT:-demo}
      OPTISTASH_IDENTITY_MODE: local
    ports: ["127.0.0.1:${API_PORT:-8400}:8400"]
    depends_on:
      db: {condition: service_healthy}
    command: [php, artisan, serve, --host=0.0.0.0, --port=8400, --no-reload]
volumes:
  pgdata:
